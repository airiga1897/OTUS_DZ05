---
- name: Restart portal
  ansible.builtin.systemd_service:
    name: otus-uwsgi
    state: restarted
    enabled: true
    daemon_reload: true

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Apply nginx configuration

- name: Reload Nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
    enabled: true
  listen: Apply nginx configuration
